[project]
name = "mcp-lightrag"
version = "0.4.0"
description = "MCP server (streamable HTTP) that lets AI agents query and add documents to a LightRAG knowledge base"
readme = "README.md"
authors = [{ name = "Chacharin Lertyosbordin", email = "lertyosbordin@outlook.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "httpx>=0.27",
]

[dependency-groups]
# tests never call a real LightRAG - see tests/conftest.py
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
