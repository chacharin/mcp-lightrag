[project]
name = "mcp-lightrag"
version = "0.1.2"
description = "MCP server bridging an AI agent (e.g. Nous Hermes Agent) to a LightRAG knowledge-graph server"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Chacharin Lertyosbordin", email = "lertyosbordin@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx2==2.13.0",
    "mcp==2.2.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
]

[project.urls]
Homepage = "https://github.com/chacharin/mcp-lightrag"
Repository = "https://github.com/chacharin/mcp-lightrag"

[project.scripts]
mcp-lightrag = "mcp_lightrag.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires a real LightRAG instance; skipped by default",
]
