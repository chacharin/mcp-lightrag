# mcp-lightrag
# - MCP endpoint http://mcp-lightrag:8700/mcp for agents on the same docker network
#   (${DOCKER_NETWORK}, default agent_network - create it once: docker network create agent_network)
# - LightRAG must be on that network too; LIGHTRAG_URL in .env points at it
# - publishes on ${PUBLISH_ADDR}:${PUBLISH_PORT} (default 0.0.0.0:8806 = reachable from other machines);
#   set MCP_AUTH_TOKEN in .env so callers must present a token
# - no volumes: the server keeps no state
# Every ${…} below is set in .env; the defaults here are generic, not tied to any one deployment.
services:
  mcp-lightrag:
    build: .
    image: mcp-lightrag:dev
    container_name: mcp-lightrag
    env_file: .env
    ports:
      - "${PUBLISH_ADDR:-0.0.0.0}:${PUBLISH_PORT:-8806}:8700"
    networks:
      - agent_network
    restart: unless-stopped

networks:
  agent_network:
    external: true
    name: ${DOCKER_NETWORK:-agent_network}
